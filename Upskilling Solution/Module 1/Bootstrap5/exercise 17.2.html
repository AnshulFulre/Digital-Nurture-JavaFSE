<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 17.2 - Icon Only Toolbar</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="bg-light py-5">

    <div class="container text-center py-5">
        <h4 class="mb-3 text-secondary">Audio Pipeline Console</h4>
        
        <div class="btn-group shadow-sm" role="group" aria-label="Media controls toolbar panel">
            <button type="button" class="btn btn-outline-secondary px-3" aria-label="Backward"><i class="bi bi-skip-backward-fill"></i></button>
            <button type="button" class="btn btn-success px-4" aria-label="Play"><i class="bi bi-play-fill"></i></button>
            <button type="button" class="btn btn-outline-secondary px-3" aria-label="Pause"><i class="bi bi-pause-fill"></i></button>
            <button type="button" class="btn btn-danger px-3" aria-label="Terminate"><i class="bi bi-stop-fill"></i></button>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

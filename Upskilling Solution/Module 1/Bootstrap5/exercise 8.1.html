<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8.1 - Registration Form</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="mb-3 fw-bold text-dark">Create an Account</h2>
                        <p class="text-muted mb-4">Please fill in this form to register with us.</p>
                        
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="regUsername" class="form-label fw-semibold">Choose Username</label>
                                <div class="input-group">
                                    <span class="input-group-text" id="username-addon">@</span>
                                    <input type="text" id="regUsername" class="form-control" placeholder="username" aria-label="Username" aria-describedby="username-addon" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="regEmail" class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="regPassword" class="form-label fw-semibold">Password</label>
                                <input type="password" id="regPassword" class="form-control" placeholder="Create a secure password" required>
                            </div>

                            <div class="mb-3">
                                <label for="userRole" class="form-label fw-semibold">Account Type</label>
                                <select class="form-select" id="userRole">
                                    <option selected value="developer">Backend Developer</option>
                                    <option value="designer">UI/UX Designer</option>
                                    <option value="manager">Project Manager</option>
                                </select>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                                <label class="form-check-label text-muted small" bitwise-label for="termsCheck">
                                    I accept the corporate <a href="#" class="text-decoration-none">Terms of Service</a> and privacy policies.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register Now</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

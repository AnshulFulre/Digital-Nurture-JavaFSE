<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6.1 - Flex Navbar</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <header class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
        
        <h5 class="my-0 mr-md-auto fw-bold text-dark mb-2 mb-md-0 me-md-auto">CustomFlexNav</h5>
        
        <nav class="my-2 my-md-0 mr-md-3 d-flex gap-3">
            <a class="p-2 text-dark text-decoration-none" href="#">Features</a>
            <a class="p-2 text-dark text-decoration-none" href="#">Enterprise</a>
            <a class="p-2 text-dark text-decoration-none" href="#">Support</a>
            <a class="p-2 text-dark text-decoration-none" href="#">Pricing</a>
        </nav>
        
        <a class="btn btn-outline-primary ms-md-3 mt-2 mt-md-0" href="#">Sign up</a>
        
    </header>

    <div class="container my-5 text-center">
        <h3>Responsive Flex Direction Bar</h3>
        <p class="text-muted">Shrink your viewport width. Notice how the row gracefully converts into an organized column stack when scaling down past the Medium break limit.</p>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

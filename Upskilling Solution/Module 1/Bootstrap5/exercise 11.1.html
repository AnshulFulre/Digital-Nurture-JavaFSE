<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 11.1 - npm Profile Card</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container d-flex justify-content-center">
        <div class="card shadow-sm" style="width: 18rem;">
            <div class="bg-primary text-white text-center py-4 rounded-top fs-1">👤</div>
            <div class="card-body text-center">
                <h5 class="card-title fw-bold">Alex Mercer</h5>
                <h6 class="card-subtitle mb-2 text-muted">Backend Architecture Student</h6>
                <p class="card-text small text-secondary">
                    Specializing in engineering high-throughput microservices using Java, Spring Boot, and MySQL.
                </p>
                <a href="#" class="btn btn-outline-primary btn-sm w-100">View Engineering Portfolio</a>
            </div>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

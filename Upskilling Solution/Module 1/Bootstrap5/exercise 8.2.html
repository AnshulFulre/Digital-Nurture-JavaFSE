<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8.2 - Floating Labels Login</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow border-0 rounded-3 bg-white">
                    <div class="card-body p-4 text-center">
                        
                        <div class="my-3">
                            <span class="fs-1">🔐</span>
                            <h3 class="fw-bold mt-2 text-dark">Welcome Back</h3>
                            <p class="text-muted small">Enter your credentials to access the terminal panel</p>
                        </div>

                        <form action="#" method="POST" class="text-start">
                            
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                                <label for="floatingEmail">Email address</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                                <label for="floatingPassword">Password</label>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault">
                                <label class="form-check-label text-muted small" for="flexSwitchCheckDefault">Keep me signed in</label>
                            </div>

                            <button class="btn btn-success w-100 py-2 fw-semibold" type="submit">Sign In</button>
                        </form>

                        <div class="mt-4 pt-2 border-top">
                            <a href="#" class="small text-decoration-none text-muted">Forgot your password?</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 14.2 - Responsive Sidebar</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container-fluid mt-4">
        <div class="row">
            
            <aside class="col-md-3 d-none d-md-block bg-white border rounded p-3 min-vh-100 shadow-sm">
                <h5 class="fw-bold text-secondary">Control Panel</h5>
                <hr>
                <div class="list-group list-group-flush">
                    <a href="#" class="list-group-item list-group-item-action active">Overview</a>
                    <a href="#" class="list-group-item list-group-item-action">Telemetry</a>
                    <a href="#" class="list-group-item list-group-item-action">Logs</a>
                </div>
            </aside>

            <main class="col-12 col-md-9">
                <div class="p-4 bg-white border rounded shadow-sm min-vh-100">
                    <h3>Primary Workspace</h3>
                    <p class="text-muted">On a mobile viewport width, the sidebar element drops out completely, letting this block expand across the entire interface seamlessly.</p>
                </div>
            </main>

        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

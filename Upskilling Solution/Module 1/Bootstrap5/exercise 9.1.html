<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9.1 - Buttons Showcase</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">
    <div class="container bg-white p-5 rounded shadow-sm">
        <h2 class="mb-4 fw-bold">Button Contextual Classes</h2>
        
        <h5 class="text-muted mb-3">Solid Buttons</h5>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-warning">Warning</button>
            <button class="btn btn-info">Info</button>
            <button class="btn btn-light">Light</button>
            <button class="btn btn-dark">Dark</button>
            <button class="btn btn-link">Link</button>
        </div>

        <h5 class="text-muted mb-3">Outline Buttons</h5>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-outline-primary">Primary Outline</button>
            <button class="btn btn-outline-secondary">Secondary Outline</button>
            <button class="btn btn-outline-success">Success Outline</button>
            <button class="btn btn-outline-danger">Danger Outline</button>
        </div>

        <h5 class="text-muted mb-3">Sizing Variations</h5>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-lg">Large Button</button>
            <button class="btn btn-primary">Standard Button</button>
            <button class="btn btn-primary btn-sm">Small Button</button>
        </div>
    </div>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 12.1 - npm Spacing Utilities</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">

    <div class="container py-5">
        <h2>Spacing Utilities</h2>
        
        <div class="bg-white text-dark mt-4 p-3 rounded">
            <h5>Box 1: <code>.mt-4 .p-3</code></h5>
            <p class="mb-0 text-muted">This box has explicit separation spacing above it and comprehensive breathing padding internally.</p>
        </div>

        <div class="bg-primary text-white m-3 p-2 rounded">
            <h5>Box 2: <code>.m-3 .p-2</code></h5>
            <p class="mb-0 opacity-75">This layer pushes outward boundaries cleanly on every single surrounding surface plane direction.</p>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7.2 - Text Transformation</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <h2 class="text-center mb-4">Exercise 7.2: Case Transformations</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <div class="mb-4">
                            <label class="small text-muted fw-bold block mb-1">Raw Code: <code>.text-uppercase</code></label>
                            <p class="text-uppercase border p-2 bg-light rounded mb-0">
                                this entire sentence was written in lowercase letters.
                            </p>
                        </div>

                        <div class="mb-4">
                            <label class="small text-muted fw-bold block mb-1">Raw Code: <code>.text-lowercase</code></label>
                            <p class="text-lowercase border p-2 bg-light rounded mb-0">
                                THIS ENTIRE SENTENCE WAS WRITTEN IN UPPERCASE LETTERS.
                            </p>
                        </div>

                        <div class="mb-0">
                            <label class="small text-muted fw-bold block mb-1">Raw Code: <code>.text-capitalize</code></label>
                            <p class="text-capitalize border p-2 bg-light rounded mb-0">
                                first letter of every single word gets capitalized here.
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

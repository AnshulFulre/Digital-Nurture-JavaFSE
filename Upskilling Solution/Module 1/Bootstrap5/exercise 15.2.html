<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 15.2 - Smooth Deep Shadow Card</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card border-0 shadow-lg p-4 bg-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="card-title fw-bold m-0 text-indigo">Secure Access Token</h4>
                            <span class="badge bg-success rounded-pill px-3 py-2">Active Node</span>
                        </div>
                        <p class="card-text text-muted mb-0">
                            This structural module box leverages strong ambient depth parameters (<code>.shadow-lg</code>) alongside an extended border-radius element style (<code>.rounded-pill</code>) to form a floating panel configuration.
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
